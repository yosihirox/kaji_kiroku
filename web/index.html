<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- `flutter build web --base-href` がこの値を置き換える。 -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="家族の「やること」と「やったこと」を、みんなで見える化する家事アプリ（試作版）">
  <meta name="theme-color" content="#F8F4EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181615" media="(prefers-color-scheme: dark)">

  <!-- ホーム画面に追加したとき用 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家事きろく">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>家事きろく</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* アプリの読み込みが終わるまで出しておく画面。真っ白な時間をなくす。 */
    html, body { height: 100%; margin: 0; background: #F8F4EC; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: #F8F4EC; color: #2B2622;
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      transition: opacity .25s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 84px; height: 84px; border-radius: 22px; }
    #splash .name { font-size: 22px; font-weight: 700; letter-spacing: .06em; }
    #splash .dots { display: flex; gap: 8px; }
    #splash .dots i {
      width: 8px; height: 8px; border-radius: 50%; background: #1F7A6E;
      animation: splash-dot 1.1s ease-in-out infinite;
    }
    #splash .dots i:nth-child(2) { animation-delay: .15s; }
    #splash .dots i:nth-child(3) { animation-delay: .3s; }
    #splash .slow { font-size: 13px; color: #6F665E; min-height: 1.4em; margin: 0; }
    @keyframes splash-dot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash .dots i { animation: none; } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #181615; }
      #splash { color: #F1EBE4; }
      #splash .dots i { background: #7FD3C4; }
      #splash .slow { color: #A89F96; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">家事きろく</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="slow" id="splash-note">読み込んでいます</p>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var note = document.getElementById('splash-note');
      var slow = setTimeout(function () {
        note.textContent = 'はじめての読み込みは少し時間がかかります';
      }, 6000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 300);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
