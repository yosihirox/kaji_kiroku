name: kaji_kiroku
description: "家族で「やること」と「やったこと」を共有する家事アプリ（試作版）"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/images/app_icon.png
  fonts:
    # Zen Maru Gothic（SIL Open Font License）。tool/subset_font.py でよく使う文字に絞ったもの。
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
